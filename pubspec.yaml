name: flowplan
description: AI 智能排程日历 — 跨平台本地优先任务管理

publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # === 状态管理 ===
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # === 路由 ===
  go_router: ^14.8.1

  # === 数据库 (drift + SQLite，兼容 freezed) ===
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # === 数据类 ===
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # === 动画 ===
  flutter_animate: ^4.5.0

  # === 日历组件（月视图复用）===
  table_calendar: ^3.1.2

  # === 通知与提醒 ===
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^5.0.0
  workmanager: ^0.9.0+3

  # === 平台集成 ===
  win32: ^5.8.0                 # Windows 前台窗口采样
  ffi: ^2.1.3                   # Dart FFI（配合 win32）
  usage_stats: ^1.3.1           # Android 应用使用时长
  permission_handler: ^11.3.1   # Android 权限管理
  device_info_plus: ^11.1.1     # 设备类型检测（驱动自适应布局）

  # === 工具 ===
  uuid: ^4.5.3                  # RFC 4122 UUID 生成
  intl: ^0.20.2                 # 中文日期格式化
  collection: ^1.19.1           # Dart 集合工具
  shared_preferences: ^2.3.4    # 轻量设置存储

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # === 代码生成 ===
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
